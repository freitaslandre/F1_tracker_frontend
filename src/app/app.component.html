<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/dashboard" aria-label="F1 Race Manager">
      <span class="brand-mark">F1</span>
      <span>
        <strong>Race Manager</strong>
        <small>Pessoal</small>
      </span>
    </a>

    <nav class="nav-links" aria-label="Navegacao principal">
      @if (auth.isAuthenticated()) {
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/fantasy" routerLinkActive="active">Fantasy</a>
        <a routerLink="/profile" routerLinkActive="active">Perfil</a>
        <button type="button" class="ghost-button" (click)="logout()">Sair</button>
      } @else {
        <a routerLink="/auth" routerLinkActive="active">Login</a>
      }
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
