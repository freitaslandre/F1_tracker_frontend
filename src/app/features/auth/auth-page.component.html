<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow">F1 Race Manager</p>
    <h1>Gere a tua temporada de F1 como um Race Manager pessoal.</h1>
    <p>
      Consulta resultados simulados no formato Jolpica, vota no Piloto do Dia e guarda os circuitos que queres seguir.
    </p>
  </div>

  <form class="panel auth-panel" (ngSubmit)="submit()">
    <div class="segmented-control" aria-label="Modo de autenticacao">
      <button type="button" [class.active]="mode() === 'login'" (click)="switchMode('login')">Login</button>
      <button type="button" [class.active]="mode() === 'register'" (click)="switchMode('register')">Registo</button>
    </div>

    @if (mode() === 'register') {
      <label>
        Nome
        <input name="name" type="text" [(ngModel)]="name" autocomplete="name" />
      </label>
    }

    <label>
      Email
      <input name="email" type="email" required [(ngModel)]="email" autocomplete="email" />
    </label>

    <label>
      Password
      <input name="password" type="password" required minlength="4" [(ngModel)]="password" autocomplete="current-password" />
    </label>

    <button class="primary-button" type="submit">
      {{ isSubmitting() ? 'A validar...' : mode() === 'login' ? 'Entrar' : 'Criar conta' }}
    </button>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <a class="text-link" routerLink="/dashboard">Voltar ao dashboard</a>
  </form>
</section>
